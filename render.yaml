# Render Blueprint for the GovJob Copilot backend API.
#
# Render resolves the Dockerfile Path from the repo root, so a root-level
# Dockerfile is provided. Its COPY commands assume backend/ is the build
# context (see backend/.dockerignore). Point Render at the Dockerfile FILE —
# not the directory — and keep the context at backend/. Otherwise the build
# fails with "failed to read dockerfile: ... /backend: is a directory".
#
# Connect this Blueprint to your EXISTING Render web service by setting `name`
# below to that service's exact name before syncing. All env vars use
# sync: false so Render preserves the values already set in the dashboard.

services:
  - type: web
    name: govjob-ai-copilot
    runtime: docker
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health

    # sync: false = Render prompts for a value on first creation and otherwise
    # preserves the dashboard value (no secrets are stored in this file).
    envVars:
      # --- required ---
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false

      # --- LLM rotation / fallback (optional) ---
      - key: GROQ_MODEL
        sync: false
      - key: GROQ_API_KEY_EXTRA
        sync: false
      - key: GROQ_API_KEYS
        sync: false
      - key: LLM_FALLBACK_BASE_URL
        sync: false
      - key: LLM_FALLBACK_API_KEY
        sync: false
      - key: LLM_FALLBACK_MODEL
        sync: false

      # --- Telegram (bot + admin alerts + webhook) ---
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_ADMIN_CHAT_ID
        sync: false

      # --- auth / security (production requires shared rate-limit storage) ---
      - key: ENVIRONMENT
        sync: false
      - key: COOKIE_SAMESITE
        sync: false
      - key: CORS_ORIGINS
        value: https://www.rozgarboard.in,https://govjob-ai-copilot.vercel.app
      - key: RATE_LIMIT_STORAGE_URL
        sync: false

      # Must be exactly "production" (not "prod") or the shared-storage
      # validation in config.py is skipped and limits stop working.
      # - key: ENVIRONMENT -> production
      #
      # Uvicorn's proxy trust. Defaults to "*" so existing deploys keep working.
      # Set this to Render's proxy address/CIDR once verified with the
      # X-Debug-IP response header, then rate-limit keys become stable.
      - key: FORWARDED_ALLOW_IPS
        sync: false

      # Canonical frontend domain (Google callback redirects here).
      - key: FRONTEND_URL
        value: https://www.rozgarboard.in

      # --- Google sign-in (custom OIDC; leave disabled until all 5 are set) ---
      - key: GOOGLE_AUTH_ENABLED
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: OAUTH_STATE_SECRET
        sync: false
      # All Google vars are sync:false — set them in the Render dashboard.

      # --- admin access, error reporting, email digest (optional) ---
      - key: ADMIN_EMAILS
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: MAIL_PROVIDER
        sync: false
      - key: MAIL_SMTP_HOST
        sync: false
      - key: MAIL_SMTP_PORT
        sync: false
      - key: MAIL_SMTP_USER
        sync: false
      - key: MAIL_SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_DIGEST_TO
        sync: false
