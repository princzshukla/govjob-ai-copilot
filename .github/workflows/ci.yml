name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per ref; a newer push cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Backend jobs are skipped when a change set contains no backend code.
  # The `skip-backend-ci` label is an explicit override for docs-only PRs
  # that happen to touch a file under backend/ (e.g. a comment fix).
  changes:
    name: Detect backend changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check changed paths
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "pull_request" && "${{ github.event_name }}" != "push" ]]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [[ -z "$BASE" || "$BASE" == "0000000000000000000000000000000000000000" ]]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED="$(git diff --name-only "$BASE" "${{ github.sha }}" || true)"
          if grep -Eq '^(backend/|scripts/|setup\.sh$|\.github/workflows/)' <<<"$CHANGED"; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

  backend:
    name: Backend tests + migrations
    needs: changes
    if: needs.changes.outputs.backend == 'true' && !contains(github.event.pull_request.labels.*.name, 'skip-backend-ci')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/govjobs_test
      GROQ_API_KEY: test-key-not-used
      COOKIE_SECURE: "false"
      RATE_LIMIT_STORAGE_URL: memory://

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Proves `alembic upgrade head` builds the schema from scratch and that
      # the migration files still match the SQLAlchemy models (no drift).
      - name: Apply migrations to an empty database
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/govjobs_migrate_check
        run: |
          python -c "import psycopg2; c = psycopg2.connect(host='localhost', user='postgres', password='postgres', dbname='postgres'); c.autocommit = True; c.cursor().execute('CREATE DATABASE govjobs_migrate_check'); c.close()"
          alembic upgrade head
          alembic check
          test "$(alembic heads | wc -l)" -eq 1
          # Every migration must be reversible, not just the latest one.
          alembic downgrade base
          alembic upgrade head
          alembic check

      - name: Run tests
        run: python -m pytest -q

  pipeline:
    name: Pipeline tests (Layer 1 + extraction + e2e)
    needs: changes
    if: needs.changes.outputs.backend == 'true' && !contains(github.event.pull_request.labels.*.name, 'skip-backend-ci')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: govjobs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/govjobs_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/govjobs_test
      GROQ_API_KEY: test-key-not-used
      COOKIE_SECURE: "false"
      RATE_LIMIT_STORAGE_URL: memory://

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply migrations to an empty database
        run: alembic upgrade head

      - name: Pipeline test suites
        run: python -m pytest tests/test_layer1_poller.py tests/test_notification_extractor.py tests/eligibility/test_pipeline_e2e.py -q

  frontend:
    name: Frontend typecheck + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The SPA ships a vitest suite (lib unit tests). Keep both steps;
      # the test gate is fast (~1s).
      - name: Tests
        run: npm test

      - name: Type-check + build
        run: npm run build
