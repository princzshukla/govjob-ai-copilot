name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per ref; a newer push cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests + migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/govjobs_test
      GROQ_API_KEY: test-key-not-used
      COOKIE_SECURE: "false"
      RATE_LIMIT_STORAGE_URL: memory://

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Proves `alembic upgrade head` builds the schema from scratch and that
      # the migration files still match the SQLAlchemy models (no drift).
      - name: Apply migrations to an empty database
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/govjobs_migrate_check
        run: |
          python -c "import psycopg2; c = psycopg2.connect(host='localhost', user='postgres', password='postgres', dbname='postgres'); c.autocommit = True; c.cursor().execute('CREATE DATABASE govjobs_migrate_check'); c.close()"
          alembic upgrade head
          alembic check
          test "$(alembic heads | wc -l)" -eq 1

      - name: Run tests
        run: python -m pytest -q

  frontend:
    name: Frontend typecheck + lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test
