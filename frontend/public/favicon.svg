<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="RozgarBoard">
  <defs>
    <clipPath id="tile">
      <rect x="1" y="1" width="62" height="62" rx="14" />
    </clipPath>
  </defs>

  <!-- ink tile -->
  <rect x="1" y="1" width="62" height="62" rx="14" fill="#141210" />

  <!-- Indian tricolor bar -->
  <g clip-path="url(#tile)">
    <rect x="10" y="46" width="12" height="6" rx="3" fill="#f07818" />
    <rect x="25" y="46" width="12" height="6" rx="3" fill="#ffffff" />
    <rect x="40" y="46" width="12" height="6" rx="3" fill="#1a7a4a" />
  </g>

  <!-- bold "R" letterform -->
  <path
    fill="#ffffff"
    fill-rule="evenodd"
    d="M16 12 H31 C39 12 44 16 44 23 C44 28 41 31 37 32 L45 42 H34 L27 33 H25 V42 H16 Z
       M25 19 V27 H30 C33 27 35 25 35 23 C35 21 33 19 30 19 Z"
  />

  <!-- thin inner outline for definition on light backgrounds -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="13.5" fill="none" stroke="#141210" stroke-width="1" />
</svg>
